            </div>
            <div class="gr-form-group gr-settings-grid">
                <div><label>作品状态</label><select id="gr-story-status" class="gr-select"><option value="连载中">连载中</option><option value="已完结">已完结</option><option value="暂停更新">暂停更新</option><option value="草稿">草稿</option></select></div>
                <div><label>标签</label><input type="text" id="gr-story-tags" class="gr-input" placeholder="用逗号分隔"></div>

            <div class="gr-form-group gr-settings-grid">
                <div>
                    <label>叙事视角</label>
                    <select id="gr-story-pov" class="gr-select">
                        <option value="第三人称有限视角">第三人称有限视角</option>

                        <option value="第一人称视角">第一人称视角</option>
                        <option value="多视角叙事">多视角叙事</option>
                    </select>
                </div>

                    <label>叙事节奏</label>
                    <select id="gr-story-tense" class="gr-select">
                        <option value="自然叙事">自然叙事</option>
                        <option value="紧凑推进">紧凑推进</option>
                        <option value="舒缓细腻">舒缓细腻</option>
                        <option value="对话驱动">对话驱动</option>
                    </select>
                </div>
            </div>
            <div class="gr-form-group">
                <label>结局或长期方向</label>
                <textarea id="gr-ending-direction" class="gr-input" rows="2" placeholder="可选。用于保持长线方向，不会要求本章立刻完成。"></textarea>

                <label>不要出现的内容 / 表达</label>
                <textarea id="gr-forbidden-content" class="gr-input" rows="2" placeholder="例如：角色突然降智、现代物品、过度使用某些词句。"></textarea>
            </div>
            <div class="gr-form-group">
    <label>宏大世界观 / IF线设定 (Macro World View)</label>
    <textarea id="gr-macro-world-view" class="gr-input" rows="3" placeholder="在此输入核心设定。例如：'民国军阀背景，Char是少帅，User是进步学生'，或者 'ABO设定，Char是Enigma'。此设定优先级最高。"></textarea>
</div>

                <div class="gr-checkbox-list" id="gr-worldbook-list"></div>
            </div>
            
             <div class="gr-form-group">

                    </select>

            </div>

        </div>
        <div class="modal-footer" style="border-top: 1px solid #E5E5E5;">

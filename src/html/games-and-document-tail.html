<!-- ▼▼▼ 你画我猜功能 ▼▼▼ -->
<div id="draw-guess-screen" class="screen">
    <div class="header">
        <span class="back-btn" onclick="showScreen('home-screen')">‹</span>
        <span>你画我猜</span>
        <div style="display: flex; gap: 10px;">
            <span class="action-btn" id="draw-guess-settings-btn">设置</span>
            <span class="action-btn" id="draw-guess-select-char-btn">选择</span>
        </div>
    </div>

    <div class="list-container" id="draw-guess-content">
        <!-- 游戏交互区域 -->
        <div id="draw-guess-interactive-area" style="display: none;">
            <div class="player-avatars-container">
                <div class="player-info">
                    <img id="draw-guess-user-avatar" src="" class="player-avatar">
                    <span id="draw-guess-user-name" class="player-name"></span>
                </div>
                <div class="player-info">
                    <img id="draw-guess-char-avatar" src="" class="player-avatar">
                    <span id="draw-guess-char-name" class="player-name"></span>
                </div>
            </div>
            <div id="draw-guess-dialogue-box"></div>
            <div class="draw-guess-input-area">
                <div id="draw-guess-action-bar" style="display:none;">
                    <button class="action-bar-btn" data-action="reply">回复</button>
                    <button class="action-bar-btn" data-action="delete">删除</button>
                    <button class="action-bar-btn" data-action="edit">编辑</button>
                    <button class="action-bar-btn" data-action="resay">重说</button>
                </div>
                <div class="draw-guess-input-row">
                    <input type="text" id="draw-guess-input" placeholder="输入你的猜测或对话...">
                    <button id="draw-guess-send-btn">发送</button>
                </div>
            </div>
        </div>

        <div id="draw-guess-main-area">
            <p id="draw-guess-welcome-text">请先点击右上角"选择"按钮<br>邀请一位伙伴来玩吧！</p>

            <div id="draw-guess-studio" style="display: none;">
                <canvas id="drawing-canvas"></canvas>
            
                <div id="draw-guess-tool-bar">
                    <div class="drawing-tools left">
                        <div class="color-palette">
                            <div class="color-dot active" style="background-color: #000000;" data-color="#000000"></div>
                            <div class="color-dot" style="background-color: #ff3b30;" data-color="#ff3b30"></div>
                            <div class="color-dot" style="background-color: #ff9500;" data-color="#ff9500"></div>
                            <div class="color-dot" style="background-color: #ffcc00;" data-color="#ffcc00"></div>
                            <div class="color-dot" style="background-color: #4cd964;" data-color="#4cd964"></div>
                            <div class="color-dot" style="background-color: #007aff;" data-color="#007aff"></div>
                            <div class="color-dot" style="background-color: #5856d6;" data-color="#5856d6"></div>
                            <div class="color-dot" style="background-color: #af52de;" data-color="#af52de"></div>
                            <div class="color-dot" style="background-color: #ffffff; border: 1px solid #ddd;" data-color="#ffffff"></div>
                        </div>
                        <div id="custom-color-picker-container" class="custom-color-picker">
                            <input type="color" id="custom-color-input" value="#000000">
                        </div>
                        <div class="tool-buttons">
                            <button class="tool-btn active" data-tool="pen">笔</button>
                            <button class="tool-btn" data-tool="eraser">橡皮</button>
                            <button class="tool-btn" data-tool="undo">撤回</button>
                            <button id="clear-canvas-btn" class="tool-btn" data-tool="clear">清空</button>
                        </div>
                    </div>
            
                    <div id="brush-settings" style="display: none; width: 100%; max-width: 150px;">
                        <div id="pen-settings">
                            <label for="pen-type-select">类型</label>
                            <select id="pen-type-select">
                                <option value="pen">钢笔</option>
                                <option value="pencil">铅笔</option>
                                <option value="watercolor">水笔</option>
                                <option value="brush">画笔</option>
                                <option value="calligraphy">毛笔</option>
                            </select>
                        </div>
                        <div class="size-control">
                            <label for="brush-size-slider">大小</label>
                            <input type="range" id="brush-size-slider" min="1" max="50" value="5">
                            <input type="number" id="brush-size-input" min="1" value="5">
                        </div>
                    </div>
                    
                    <div class="game-controls-group">
                        <button class="game-control-btn" id="draw-guess-get-topic-btn">AI出题</button>
                        <button class="game-control-btn" id="draw-guess-ai-turn-btn">轮到他了</button>
                    </div>
                </div>
            </div>
        </div>

        <div id="draw-guess-bottom-bar" style="display: none;">
            <button id="start-draw-guess-game-btn" class="form-button">开始游戏</button>
        </div>
    </div>
</div>

<div id="draw-guess-message-manager-modal" class="modal">
    <div class="modal-content" style="height: 70%;">
        <div class="modal-header">
            <span id="draw-guess-manager-title">管理消息</span>
            <label style="font-size: 14px; font-weight: normal; display: flex; align-items: center; gap: 5px;">
                <input type="checkbox" id="draw-guess-manager-select-all"> 全选
            </label>
        </div>
        <div class="modal-body" id="draw-guess-manager-list" style="padding: 0;"></div>
        <div class="modal-footer">
            <button class="cancel" id="draw-guess-manager-cancel-btn">取消</button>
            <button class="save" id="draw-guess-manager-confirm-btn">确认</button>
        </div>
    </div>
</div>

<!-- 你画我猜设置弹窗 -->
<div id="draw-guess-settings-modal" class="modal">
    <div class="modal-content" style="max-width: 400px;">
        <div class="modal-header">
            <span>游戏模式设置</span>
        </div>
        <div class="modal-body">
            <div class="setting-item">
                <label style="font-weight: 500; margin-bottom: 8px; display: block;">选择游戏模式</label>
                <div style="display: flex; flex-direction: column; gap: 12px;">
                    <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; padding: 10px; border: 1px solid var(--border-color); border-radius: 8px; background: var(--bg-primary);">
                        <input type="radio" name="draw-guess-mode" value="online" id="draw-guess-mode-online" checked>
                        <div>
                            <div style="font-weight: 500;">线上模式</div>
                            <div style="font-size: 12px; color: var(--text-secondary); margin-top: 4px;">模拟线上聊天，角色可发多条简短消息</div>
                        </div>
                    </label>
                    <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; padding: 10px; border: 1px solid var(--border-color); border-radius: 8px; background: var(--bg-primary);">
                        <input type="radio" name="draw-guess-mode" value="offline" id="draw-guess-mode-offline">
                        <div>
                            <div style="font-weight: 500;">线下模式</div>
                            <div style="font-size: 12px; color: var(--text-secondary); margin-top: 4px;">模拟面对面场景，包含动作和场景描写</div>
                        </div>
                    </label>
                </div>
            </div>
        </div>
        <div class="modal-footer">
            <button class="cancel" id="draw-guess-settings-cancel-btn">取消</button>
            <button class="save" id="draw-guess-settings-save-btn">保存</button>
        </div>
    </div>
</div>
<!-- ▲▲▲ 你画我猜HTML结束 ▲▲▲ -->

</div>

  <!-- 全屏编辑器弹窗 -->
  <div id="fullscreen-editor-modal" class="modal" style="z-index: 10201;">
    <div class="modal-content" style="height: 90%; width: 90%; max-width: 800px; display: flex; flex-direction: column; background: var(--bg-primary, #fff);">
      <div class="modal-header">
        <span id="fullscreen-editor-title">全屏编辑</span>
      </div>
      <div class="modal-body" style="flex: 1; padding: 15px; display: flex; flex-direction: column; overflow: hidden;">
        <textarea id="fullscreen-editor-textarea" style="flex: 1; width: 100%; resize: none; padding: 15px; border: 1px solid var(--border-color, #ccc); border-radius: 8px; font-size: 15px; line-height: 1.6; font-family: inherit; box-sizing: border-box; background: var(--input-bg, #fff); color: var(--text-primary, #333); outline: none;"></textarea>
      </div>
      <div class="modal-footer" style="flex-shrink: 0;">
        <button class="cancel" onclick="closeFullscreenEditor()">取消</button>
        <button class="save" onclick="saveFullscreenEditor()">保存</button>
      </div>
    </div>
  </div>

  <script>
    let currentFullscreenEditorTarget = '';
    function openFullscreenEditor(targetId, title) {
        currentFullscreenEditorTarget = targetId;
        document.getElementById('fullscreen-editor-title').textContent = '编辑: ' + title;
        document.getElementById('fullscreen-editor-textarea').value = document.getElementById(targetId).value;
        document.getElementById('fullscreen-editor-modal').classList.add('visible');
    }
    function closeFullscreenEditor() {
        document.getElementById('fullscreen-editor-modal').classList.remove('visible');
        currentFullscreenEditorTarget = '';
    }
    function saveFullscreenEditor() {
        if (currentFullscreenEditorTarget) {
            const targetEl = document.getElementById(currentFullscreenEditorTarget);
            targetEl.value = document.getElementById('fullscreen-editor-textarea').value;
            // 触发事件以同步可能存在的监听器
            targetEl.dispatchEvent(new Event('input', { bubbles: true }));
            targetEl.dispatchEvent(new Event('change', { bubbles: true }));
        }
        closeFullscreenEditor();
    }
  </script>
